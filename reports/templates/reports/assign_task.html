{% extends "reports/base.html" %}
{% block content %}

<div class="container mt-4">

    <h3 class="mb-4 text-center">
        <i class="bi bi-person-plus me-1"></i>
        Assigner une tâche à {{ technician.user.username }}
    </h3>

    <!-- Bouton retour Dashboard -->
    <div class="mb-3 text-start">
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left-circle me-1"></i>Retour au Dashboard
        </a>
    </div>

    {% if tasks %}
    <div class="card p-4 mx-auto" style="max-width: 500px;">
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="task" class="form-label">Choisir une tâche :</label>
                <select name="task" id="task" class="form-select" required>
                    {% for task in tasks %}
                        <option value="{{ task.id }}">
                            {{ task.title }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-circle me-1"></i>Annuler
                </a>
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-person-plus me-1"></i>Assigner
                </button>
            </div>
        </form>
    </div>
    {% else %}
    <div class="alert alert-warning text-center">
        <i class="bi bi-exclamation-triangle me-1"></i>
        Aucune tâche disponible à assigner.
    </div>
    {% endif %}

</div>

{% endblock %}
