<!DOCTYPE html>
<html lang="fr">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>{% block title %}Gestion Équipe Technique{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS global application -->
    <link rel="stylesheet" href="{% static 'stylesheet.css' %}">

    {% block css %}{% endblock %}
</head>

<body class="app-body d-flex flex-column min-vh-100">

    {% block header %}
    <header class="text-center py-3 bg-primary text-white">
        <h1>Gestion Équipe Technique</h1>
    </header>
    {% endblock %}

    <main class="app-main flex-fill d-flex justify-content-center align-items-start py-4">
        <div class="app-container w-100">
            {% block content %}
            <!-- Contenu des pages ici -->
            {% endblock %}
        </div>
    </main>

    {% block footer %}
    <footer class="app-footer text-center mt-auto">
        <small>© 2025 — Application de gestion technique</small>
    </footer>
    {% endblock %}

</body>

</html>
