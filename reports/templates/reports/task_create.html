{% extends "reports/base.html" %}
{% load static %}

{% block content %}
<div class="container app-container">

    <div class="card create-card mx-auto" style="max-width: 600px;">
        <h4 class="fw-bold text-center mb-3">
            <i class="bi bi-plus-circle"></i> Nouvelle tâche
        </h4>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Titre</label>
                <input type="text" name="title" class="form-control" placeholder="Nom de la tâche" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Description succincte" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Lieu</label>
                <input type="text" name="location" class="form-control" placeholder="Ex: Kinshasa" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Durée estimée</label>
                <div class="d-flex gap-2">
                    <input type="number" name="hours" class="form-control" placeholder="H" min="0" required>
                    <input type="number" name="minutes" class="form-control" placeholder="M" min="0" max="59" required>
                    <input type="number" name="seconds" class="form-control" placeholder="S" min="0" max="59" required>
                </div>
                <small class="text-muted">Remplissez uniquement les nombres, pas besoin de ":"</small>
            </div>

            {% if error %}
                <div class="alert alert-danger mt-2">
                    {{ error }}
                </div>
            {% endif %}

            <div class="d-flex justify-content-between mt-3">
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-circle"></i> Annuler
                </a>
                <button class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Créer la tâche
                </button>
            </div>
        </form>
    </div>

</div>

<script>
    // JS pour combiner H:M:S en HH:MM:SS avant POST
    document.querySelector('form').addEventListener('submit', function(e) {
        const h = document.querySelector('input[name="hours"]').value.padStart(2,'0');
        const m = document.querySelector('input[name="minutes"]').value.padStart(2,'0');
        const s = document.querySelector('input[name="seconds"]').value.padStart(2,'0');
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'estimated_duration';
        input.value = `${h}:${m}:${s}`;
        this.appendChild(input);
    });
</script>
{% endblock %}
